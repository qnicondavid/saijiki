[package]
name = "saijiki"
version = "0.1.0"
description = "saijiki — an almanac of small good things"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "saijiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "saijiki"
path = "src/main.rs"
