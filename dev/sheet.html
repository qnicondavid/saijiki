<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>saijiki · the sheet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2a2622;
        color: #cdbfa8;
        font: 12px/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
      }
      #keys b {
        color: #f0e6d2;
        font-weight: 600;
      }
      #stage {
        display: grid;
        place-items: center;
      }
      #frame {
        width: 420px;
        height: 300px;
        resize: both;
        overflow: hidden;
        outline: 1px dashed #4a423a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="keys">
      <b>0 1 3</b> · <b>4</b> forty · <b>5</b> a hundred and fifty holes &nbsp;·&nbsp;
      <b>h</b> hatch one &nbsp;·&nbsp; <b>H</b> hatch three &nbsp;·&nbsp; <b>a</b> age the cuts
      &nbsp;·&nbsp; <b>v</b> paper &nbsp;·&nbsp; drag the corner to resize
      <div id="status"></div>
    </div>
    <div id="stage"><div id="frame"><canvas id="canvas"></canvas></div></div>
    <script type="module" src="/dev/sheet.ts"></script>
  </body>
</html>
